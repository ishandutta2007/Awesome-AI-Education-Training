<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1145" />
    </linearGradient>

    <!-- Header Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <!-- Glowing Node Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .neural-line {
      stroke-dasharray: 8, 8;
      animation: dash 20s linear infinite;
    }
    @keyframes dash {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    .pulse-node {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    .pulse-node-2 {
      animation: pulse 4s ease-in-out infinite alternate 1.5s;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.95); }
      100% { opacity: 0.85; transform: scale(1.05); }
    }
    .flow-wave {
      animation: floatWave 8s ease-in-out infinite alternate;
    }
    @keyframes floatWave {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.2px;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Dynamic / Animated Background Wave & Neural Network Elements (strictly in background) -->
  <g opacity="0.3" class="flow-wave">
    <path d="M0,280 C300,220 450,340 750,260 C950,200 1100,290 1200,250 L1200,360 L0,360 Z" fill="#6366f1" opacity="0.15" />
    <path d="M0,310 C350,260 500,350 850,280 C1050,230 1150,310 1200,290 L1200,360 L0,360 Z" fill="#0ea5e9" opacity="0.1" />
  </g>

  <!-- Background Constellation / Neural Lines -->
  <g opacity="0.35">
    <line x1="80" y1="80" x2="220" y2="130" stroke="#38bdf8" stroke-width="1.5" class="neural-line" />
    <line x1="220" y1="130" x2="160" y2="260" stroke="#818cf8" stroke-width="1.5" class="neural-line" />
    <line x1="1020" y1="70" x2="1120" y2="150" stroke="#c084fc" stroke-width="1.5" class="neural-line" />
    <line x1="1120" y1="150" x2="1050" y2="280" stroke="#38bdf8" stroke-width="1.5" class="neural-line" />
    <line x1="950" y1="180" x2="1050" y2="280" stroke="#818cf8" stroke-width="1.5" class="neural-line" />
  </g>

  <!-- Dynamic Glowing Nodes -->
  <g filter="url(#glow)">
    <circle cx="80" cy="80" r="5" fill="#38bdf8" class="pulse-node" />
    <circle cx="220" cy="130" r="4" fill="#818cf8" class="pulse-node-2" />
    <circle cx="160" cy="260" r="6" fill="#c084fc" class="pulse-node" />
    <circle cx="1020" cy="70" r="5" fill="#c084fc" class="pulse-node-2" />
    <circle cx="1120" cy="150" r="6" fill="#38bdf8" class="pulse-node" />
    <circle cx="1050" cy="280" r="4" fill="#818cf8" class="pulse-node-2" />
    <circle cx="950" cy="180" r="5" fill="#38bdf8" class="pulse-node" />
  </g>

  <!-- Foreground Center Content (Fixed, high contrast, clean visibility) -->
  <!-- Top Category Tag -->
  <g transform="translate(600, 70)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="-115" cy="0" r="5" fill="#10b981" />
    <text x="-98" y="4" fill="#f8fafc" class="badge-pill-text">CURATED MASTER ROADMAP &amp; ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="150" text-anchor="middle" fill="url(#titleGrad)" class="title-text">
    Awesome AI Education &amp; Training
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" fill="url(#subGrad)" class="subtitle-text">
    Curated Hub of Top SaaS Platforms &amp; Open-Source Repositories
  </text>
  <text x="600" y="230" text-anchor="middle" fill="#64748b" class="subtitle-text" font-size="15px">
    Deep Learning • Large Language Models • MLOps • Generative AI Engineering
  </text>

  <!-- Feature Tags / Pills -->
  <g transform="translate(600, 290)">
    <!-- Pill 1 -->
    <rect x="-310" y="-16" width="135" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.9" />
    <text x="-242" y="4" text-anchor="middle" fill="#93c5fd" class="badge-pill-text">🎓 Structured Labs</text>

    <!-- Pill 2 -->
    <rect x="-155" y="-16" width="145" height="32" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" opacity="0.9" />
    <text x="-82" y="4" text-anchor="middle" fill="#c4b5fd" class="badge-pill-text">⚡ Generative AI</text>

    <!-- Pill 3 -->
    <rect x="10" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1" opacity="0.9" />
    <text x="80" y="4" text-anchor="middle" fill="#f472b6" class="badge-pill-text">📊 Verified Pricing</text>

    <!-- Pill 4 -->
    <rect x="170" y="-16" width="140" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1" opacity="0.9" />
    <text x="240" y="4" text-anchor="middle" fill="#6ee7b7" class="badge-pill-text">⭐ Star-Ranked OS</text>
  </g>
</svg>
